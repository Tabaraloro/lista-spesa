<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lista della spesa</title>
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F5F3EE;--bg-2:#FFFFFF;--bg-3:#ECE9E1;--ink:#1E1C18;--ink-2:#5C574D;--ink-3:#8E887B;
  --line:#DCD8CE;--accent:#2E5E9E;--accent-ink:#FFFFFF;--ok:#2E7D4F;--ok-bg:#E3F1E7;--warn:#B3641A;
  --W:#F3E9B8;--U:#B9D3EE;--B:#B8B2C4;--R:#F0B7A6;--G:#BFD9BB;--M:#E8D28C;--C:#D9D6CF;--L:#D4C8B4;
  --radius:10px;--shadow:0 1px 2px rgba(30,28,24,.06),0 8px 24px rgba(30,28,24,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181C;--bg-2:#1F2126;--bg-3:#262930;--ink:#ECEAE3;--ink-2:#B3AFA4;--ink-3:#7E7A70;
  --line:#33363E;--accent:#7FA8E0;--accent-ink:#0F1A2B;--ok:#7ACB98;--ok-bg:#1E3327;--warn:#E0A05A;
  --W:#5C5533;--U:#2B4664;--B:#3E3A4A;--R:#63382C;--G:#2F4A2E;--M:#5A4E24;--C:#3A3C41;--L:#4A4130;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181C;--bg-2:#1F2126;--bg-3:#262930;--ink:#ECEAE3;--ink-2:#B3AFA4;--ink-3:#7E7A70;
  --line:#33363E;--accent:#7FA8E0;--accent-ink:#0F1A2B;--ok:#7ACB98;--ok-bg:#1E3327;--warn:#E0A05A;
  --W:#5C5533;--U:#2B4664;--B:#3E3A4A;--R:#63382C;--G:#2F4A2E;--M:#5A4E24;--C:#3A3C41;--L:#4A4130;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.4;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.segnap{width:56px;aspect-ratio:5/7;border-radius:4px;background:var(--bg-3);border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--ink-3);text-align:center;line-height:1.2;padding:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--bg-3);color:var(--ink-2);letter-spacing:.02em}
.badge.it{background:var(--G);color:var(--ink)}
.badge.mazzo{font-weight:500;letter-spacing:0}
.prezzo{white-space:nowrap}
.prezzo small{color:var(--ink-3)}
.azione{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--bg-3);color:var(--ink)}
.btn.ok{background:var(--ok-bg);color:var(--ok)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:8px 0 14px}
.stampa{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;font-size:12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stampa:hover{border-color:var(--accent)}
.stampa img,.stampa .segnap{width:100%;aspect-ratio:5/7;border-radius:5px;object-fit:cover}
.stampa .sn{font-weight:600;font-size:12px;line-height:1.25}
.stampa .sd{color:var(--ink-2);font-size:11px;line-height:1.3}
.stampa .sp{font-weight:600;font-size:13px}
.foglio h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:14px 0 2px}
.foglio .ordina{display:flex;gap:4px;background:var(--bg-3);border-radius:8px;padding:3px;margin:4px 0 6px}
.foglio .ordina button{flex:1;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:500;padding:6px;border-radius:6px;cursor:pointer}
.foglio .ordina button[aria-pressed="true"]{background:var(--bg-2);color:var(--ink);box-shadow:var(--shadow)}
.foglio .testa{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
/* foglio in basso */
.velo{position:fixed;inset:0;background:rgba(20,18,14,.45);z-index:9}
.foglio{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg-2);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;max-width:820px;margin:0 auto}
.foglio h2{font-size:17px;margin:0 0 2px}
.foglio .sub{color:var(--ink-2);font-size:13px;margin-bottom:12px}
.foglio .campi{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-bottom:12px}
.foglio input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.foglio .scelte{display:flex;flex-direction:column;gap:8px}
.foglio .scelte .btn{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}
.foglio .scelte .btn small{font-weight:400;opacity:.8}
.foglio .storico{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.foglio .storico div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.foglio .storico .btn{padding:5px 9px;font-size:13px}
.btn.piccolo{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.cerco-on{background:var(--U);color:var(--ink)}
.foglio textarea{width:100%;min-height:140px;font:13px "IBM Plex Mono",ui-monospace,monospace;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical;margin:4px 0 12px}
.foglio .due{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scheda{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin:6px 0 12px}
.scheda img.grande{width:146px;border-radius:7px;flex:none;cursor:zoom-in;display:block}
.scheda img.grande.zoom{width:100%;max-width:440px;cursor:zoom-out}
.testo-carta{flex:1 1 220px;min-width:0;font-size:14px;line-height:1.45}
.testo-carta .tc-nome{font-weight:600}
.testo-carta .tc-tipo{font-size:13px;color:var(--ink-2);margin:2px 0 6px}
.testo-carta .tc-pt{font-weight:600;font-size:13px;margin-top:6px;text-align:right}
.testo-carta .faccia+.faccia{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.testo-carta .nota-it{font-size:12px;color:var(--ink-3);margin-top:6px}
.sim{display:inline-block;min-width:18px;padding:0 4px;margin:0 1px;border-radius:9px;border:1px solid var(--line);background:var(--bg-3);font:600 11px/16px "IBM Plex Mono",ui-monospace,monospace;text-align:center;vertical-align:1px}
.lingue{display:inline-flex;gap:2px;background:var(--bg-3);border-radius:6px;padding:2px;margin-bottom:6px}
.lingue button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12px;font-weight:600;padding:3px 9px;border-radius:5px;cursor:pointer}
.lingue button[aria-pressed="true"]{background:var(--bg-2);color:var(--ink);box-shadow:var(--shadow)}
.btn.carrello{background:var(--M);color:var(--ink)}
.modo{display:flex;gap:4px;background:var(--bg-3);border-radius:8px;padding:3px;margin:0 0 10px}
.modo button{flex:1;border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;padding:7px 6px;border-radius:6px;cursor:pointer}
.modo button[aria-pressed="true"]{background:var(--bg-2);color:var(--ink);box-shadow:var(--shadow)}
.delta{font-size:12px;font-weight:600;white-space:nowrap}
.delta.su{color:var(--warn)}.delta.giu{color:var(--ok)}
.totali{border-top:2px solid var(--line);margin-top:4px;padding:10px 0 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.totali b{font-size:16px}
.totali .t{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- solo nell'app ---- */
/* nel telefono resta fisso in alto solo cio' che serve mentre scorri: viste e ricerca */
.accesso{max-width:420px;margin:24px auto;text-align:left;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.accesso h2{margin:0;font-size:20px}
.accesso p{margin:0;color:var(--ink-2);font-size:14px}
.accesso input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg-2);color:var(--ink)}
.foglio.menu h3{margin-top:20px}
.foglio.menu .btn{margin:4px 0}
.foglio .campi.tre{grid-template-columns:1fr 1fr 64px}
@media (max-width:520px){.foglio .campi.tre{grid-template-columns:1fr 64px}.foglio .campi.tre #m-nome{grid-column:1 / -1}}
label.btn{cursor:pointer}
.accesso .acc-altro{display:flex;flex-wrap:wrap;gap:6px}
.accesso .acc-altro .btn{flex:1 1 auto}

/* ---- intestazione ---- */
.intesta{padding:10px 16px 4px;background:var(--bg);max-width:820px;margin:0 auto}
.titolo-app{display:flex;align-items:center;gap:8px}
.titolo-app h1{flex:1;min-width:0;font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icona{width:44px;height:44px;border:0;border-radius:10px;background:var(--bg-3);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.icona svg{width:22px;height:22px}
#apri-menu{min-height:44px;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 16px 8px}
header>*{max-width:788px;margin-left:auto;margin-right:auto}
.filtri{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#filtri-extra{margin-top:8px}
.filtri input[type=search],.filtri select,.filtri input[type=number]{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);color:var(--ink);min-width:0;min-height:44px}
.filtri input[type=search]{flex:1 1 160px}
.filtri select{flex:0 1 160px}.filtri input[type=number]{width:96px}
.filtri label.tog{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);cursor:pointer;user-select:none;min-height:36px}
#apri-filtri{min-height:44px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
#sezioni{margin-bottom:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}#viste{margin-top:8px}
#sezioni button{padding:7px 4px;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.chips button{border:1px solid var(--line);background:var(--bg-2);color:var(--ink-2);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;min-height:38px;flex:none}
.chips button[aria-pressed="true"]{background:var(--U);border-color:transparent;color:var(--ink)}
.chips button b{font-weight:600;margin-left:2px}
.riepilogo{max-width:820px;margin:0 auto;padding:10px 16px 4px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.riepilogo b{color:var(--ink);font-weight:600}
.riepilogo .btn{margin-left:auto;min-height:38px}
main{padding:4px 0 calc(var(--basso,20px) + 90px);max-width:820px;margin:0 auto}
.vuoto{padding:48px 24px;text-align:center;color:var(--ink-2)}
.vuoto b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.nota{font-size:12px;color:var(--ink-3);text-align:center;padding:18px 16px 0}
/* ---- gruppi: il titolo resta attaccato sotto l'intestazione mentre scorri ---- */
.sezione{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:22px 16px 8px}
.sezione:first-child{margin-top:10px}
.sezione small{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink-3);margin-left:6px}
.sezione .spiega{font-weight:400;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-3);margin-top:2px}
.gruppo{border-top:1px solid var(--line)}
.gruppo:last-of-type{border-bottom:1px solid var(--line)}
.gruppo>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:52px;cursor:pointer;position:sticky;top:var(--alto,0px);z-index:3;background:var(--bg)}
.gruppo>summary::-webkit-details-marker{display:none}
.gruppo>summary .titolo{flex:1;min-width:0}
.gruppo>summary .nome{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gruppo>summary .sotto{font-size:12px;color:var(--ink-2)}
.gruppo>summary .conta{font-weight:600;color:var(--accent);font-size:14px;white-space:nowrap}
.gruppo>summary .freccia{color:var(--ink-3);font-size:18px;transition:transform .15s}
.gruppo[open]>summary .freccia{transform:rotate(90deg)}
.swatch{width:10px;height:24px;border-radius:3px;flex:none}
/* ---- carta: immagine con il nome sotto, se l'immagine non arriva ---- */
.mini{position:relative;display:block;width:100%;aspect-ratio:5/7;border-radius:4px;overflow:hidden}
.mini-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;line-height:1.15;padding:3px;color:var(--ink-2);overflow:hidden;word-break:break-word}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* ---- Elenco: righe ---- */
.righe{background:var(--bg-2)}
.r{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 16px;border-top:1px solid var(--line);min-height:68px}
.r-img{border:0;padding:0;background:none;cursor:pointer;width:44px;flex:none;border-radius:4px}
.r-tx{flex:1;min-width:0;cursor:pointer}
.r-nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sb{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-sb b{color:var(--ink);font-weight:600}
.r-sb .set{color:var(--ink-3)}
.r.fatta .r-nm{text-decoration:line-through;color:var(--ink-2)}
.r.fatta .mini{opacity:.5}
.nelc{color:var(--warn);font-weight:600}
.segna{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink-3);flex:none}
.segna svg{width:24px;height:24px}
.segna[aria-pressed="true"]{color:var(--accent)}
.segna[aria-pressed="true"] svg path{fill:currentColor}
.spunta{width:44px;height:44px;display:grid;place-items:center;color:var(--ok);flex:none}
.spunta svg{width:22px;height:22px}
.r .btn{min-height:44px;flex:none}
/* ---- Raccoglitore: griglia ---- */
.cas-griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px 8px;padding:4px 12px 14px}
.cas{border:0;padding:0;background:none;cursor:pointer;text-align:left;min-width:0;display:block;color:inherit;font:inherit}
.cas-im{position:relative;display:block}
.cas-im .mini{border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cas .pz{position:absolute;left:5px;bottom:5px;background:var(--bg-2);color:var(--ink);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.cas .marca{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.cas .marca svg{width:15px;height:15px}
.cas .marca.cerco svg path{fill:currentColor}
.cas .marca.carr{background:var(--M);color:var(--ink)}
.cas .marca.trov{background:var(--ok);color:var(--bg)}
.cas .copie-b{position:absolute;right:5px;bottom:5px;background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 5px;font-size:11px;font-weight:600}
.cas.fatta .mini{filter:grayscale(.8);opacity:.5}
.cas-n{display:block;font-size:12px;color:var(--ink-2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cas-s{display:block;font-size:11px;color:var(--ink-3)}
/* ---- barre in basso ---- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--bg-2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:58px;cursor:pointer;color:var(--ink-3);font:inherit;font-size:12px;font-weight:500;position:relative;max-width:200px;width:100%;margin:0 auto}
.nav button svg{width:24px;height:24px}
.nav .pill{border-radius:999px;padding:3px 18px;display:grid;place-items:center}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .pill{background:var(--U)}
.nav .num{position:absolute;top:1px;left:calc(50% + 10px);background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
.barra-c{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:8;background:var(--ink);color:var(--bg);border:0;border-radius:14px;box-shadow:var(--shadow);padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;font:inherit;font-size:15px;min-height:52px}
.barra-c svg{width:22px;height:22px;flex:none}.barra-c .t{flex:1;text-align:left}
.piede{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:7;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:10px}
.piede .t{flex:1;font-size:13px;color:var(--ink-2);line-height:1.2}.piede .t b{font-size:18px;color:var(--ink)}
.piede .btn{min-height:46px;padding:10px 18px}
.carr-pagina{padding:4px 16px 80px}
.carr-pagina .scelte{margin-top:6px}
/* ---- carrello: righe con prezzo ---- */
.voce-c{display:grid;grid-template-columns:40px 1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.voce-c .vi{grid-row:1 / span 2;border:0;padding:0;background:none;cursor:pointer;width:40px}
.voce-c .vn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:2}
.voce-c .vd{font-size:12px;color:var(--ink-2);grid-column:2}
.voce-c .vp{display:flex;align-items:center;gap:6px;grid-column:3;grid-row:1 / span 2;justify-content:flex-end}
.voce-c input{width:84px;padding:8px;text-align:right;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:40px}
/* ---- scheda della carta: azioni ---- */
.azioni-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:2px 0 6px}
.azioni-c .btn{min-height:46px}
.stato-c{font-size:13px;color:var(--ink-2);margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stato-c .btn{margin-left:auto}
.scelta-c{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.scelta-c b{color:var(--ink)}
.stampa[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
/* ---- menu a blocchi, aggiungi, togli ---- */
.icona.piu{background:var(--accent);color:var(--accent-ink)}
.foglio.menu .blocco{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.foglio.menu .blocco h3{margin:0 0 6px}
.foglio.menu .blocco .sub{margin-bottom:8px}
.foglio.menu .blocco .btn{margin:0}
.foglio.menu .storico{margin-top:8px;padding-top:4px;border-top:0}
.foglio.menu .storico div{padding:7px 0;border-top:1px solid var(--line)}
.foglio .piega>summary{cursor:pointer;font-weight:600;padding:6px 0;list-style:none;display:flex;align-items:center;gap:6px}
.foglio .piega>summary::-webkit-details-marker{display:none}
.foglio .piega>summary::before{content:"›";display:inline-block;color:var(--ink-3);transition:transform .15s}
.foglio .piega[open]>summary::before{transform:rotate(90deg)}
.foglio .piega.blocco>summary{font-size:15px}
.foglio .passi{margin:0 0 8px;padding-left:20px}.foglio .passi li{margin-bottom:6px}
.sd{color:var(--ink-3);font-weight:400}
button.link{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
/* ---- avviso con Annulla ---- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--basso,20px) + 12px + env(safe-area-inset-bottom,0px));z-index:12;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);width:max-content;min-height:44px}
.toast span{padding:4px 8px 4px 0}
.toast button{border:0;background:transparent;color:var(--U);font:inherit;font-weight:700;padding:8px 10px;cursor:pointer;min-height:40px;border-radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button{color:var(--accent-ink)}}
</style>
</head>
<body>
<div class="intesta">
  <div class="titolo-app"><h1 id="titolo">Lista della spesa</h1>
    <button class="icona" id="aspetto" type="button" aria-label="Cambia aspetto"></button>
    <button class="btn sec piccolo" id="apri-menu" type="button">Menu</button></div>
</div>
<header>
  <div class="chips" id="sezioni" role="group" aria-label="Sezioni" hidden></div>
  <div class="filtri">
    <input type="search" id="cerca" placeholder="Cerca una carta…" autocomplete="off" aria-label="Cerca una carta">
    <button class="btn sec" id="apri-filtri" type="button" aria-expanded="false" aria-controls="filtri-extra">Filtri</button>
    <button class="icona piu" id="aggiungi" type="button" aria-label="Aggiungi una carta" title="Aggiungi una carta a mano" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="filtri" id="filtri-extra" hidden>
    <select id="mazzo" aria-label="Mazzo"><option value="">Tutti i mazzi</option></select>
    <select id="categoria" aria-label="Scaffale">
      <option value="">Tutti i set</option>
      <option value="normale">Solo set normali</option>
      <option value="commander">Solo set Commander</option>
      <option value="speciale">Solo set speciali</option>
    </select>
    <input type="number" id="maxprezzo" placeholder="max €" min="0" step="0.5" inputmode="decimal" aria-label="Prezzo massimo">
    <label class="tog"><input type="checkbox" id="soloit"> solo stampe in italiano</label>
    <label class="tog"><input type="checkbox" id="nascondi" checked> nascondi le trovate</label>
    <label class="tog"><input type="checkbox" id="estesi" checked> nomi dei set per esteso</label>
  </div>
  <div class="chips" id="viste" role="group" aria-label="Raggruppa" hidden></div>
</header>
<div class="riepilogo" id="riepilogo" hidden></div>
<main id="lista"></main>
<nav class="nav" id="nav" aria-label="Sezioni" hidden></nav>
<button class="barra-c" id="barra-carrello" type="button" hidden></button>
<div id="foglio-wrap" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="scryfall.js?v=4"></script>
<script src="store.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
